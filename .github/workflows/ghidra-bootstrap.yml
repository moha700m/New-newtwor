name: Bootstrap Ghidra 12.1.4

on:
  push:
    paths:
      - ".github/workflows/ghidra-bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Download official Ghidra release
        shell: bash
        run: |
          set -euo pipefail
          URL="https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.4_build/ghidra_12.1.4_PUBLIC_20260921.zip"
          curl -fL --retry 5 --retry-delay 2 "$URL" -o ghidra_12.1.4_PUBLIC_20260921.zip

      - name: Verify SHA-256
        shell: bash
        run: |
          set -euo pipefail
          echo "ddac49f903da9d5bac833e5cc79395098b9c33cfd3279be5f31bd00387d2d4db  ghidra_12.1.4_PUBLIC_20260921.zip" | sha256sum -c -

      - name: Upload verified Ghidra package
        uses: actions/upload-artifact@v4
        with:
          name: ghidra-12.1.4-official
          path: ghidra_12.1.4_PUBLIC_20260921.zip
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
