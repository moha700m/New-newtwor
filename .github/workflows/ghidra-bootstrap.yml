name: Bootstrap Ghidra 12.1.4

on:
  push:
    paths:
      - ".github/workflows/ghidra-bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Download official Ghidra release
        shell: bash
        run: |
          set -euo pipefail
          URL="https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.4_build/ghidra_12.1.4_PUBLIC_20260921.zip"
          curl -fL --retry 5 --retry-delay 2 "$URL" -o ghidra_12.1.4_PUBLIC_20260921.zip

      - name: Verify SHA-256
        shell: bash
        run: |
          set -euo pipefail
          echo "ddac49f903da9d5bac833e5cc79395098b9c33cfd3279be5f31bd00387d2d4db  ghidra_12.1.4_PUBLIC_20260921.zip" | sha256sum -c -

      - name: Split package for connector transfer
        shell: bash
        run: |
          set -euo pipefail
          split -b 180M -d -a 2 ghidra_12.1.4_PUBLIC_20260921.zip ghidra.part.
          ls -lh ghidra.part.*
          test -f ghidra.part.00
          test -f ghidra.part.01
          test -f ghidra.part.02
          test -f ghidra.part.03

      - name: Upload part 00
        uses: actions/upload-artifact@v4
        with:
          name: ghidra-part-00
          path: ghidra.part.00
          compression-level: 0
          retention-days: 1
      - name: Upload part 01
        uses: actions/upload-artifact@v4
        with:
          name: ghidra-part-01
          path: ghidra.part.01
          compression-level: 0
          retention-days: 1
      - name: Upload part 02
        uses: actions/upload-artifact@v4
        with:
          name: ghidra-part-02
          path: ghidra.part.02
          compression-level: 0
          retention-days: 1
      - name: Upload part 03
        uses: actions/upload-artifact@v4
        with:
          name: ghidra-part-03
          path: ghidra.part.03
          compression-level: 0
          retention-days: 1
