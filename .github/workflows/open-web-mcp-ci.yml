name: open-web-mcp-ci

on:
  push:
    branches: [open-web-mcp]
    paths:
      - 'open-web-mcp/**'
      - '.github/workflows/open-web-mcp-ci.yml'
  pull_request:
    paths:
      - 'open-web-mcp/**'
      - '.github/workflows/open-web-mcp-ci.yml'

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: open-web-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  browser-integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: open-web-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: RUN_LIVE_TESTS=1 npx vitest run tests/live.integration.test.ts
