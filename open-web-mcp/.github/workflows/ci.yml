name: ci

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  browser-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: RUN_LIVE_TESTS=1 npx vitest run tests/live.integration.test.ts

  docker-and-inspector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Build and start Compose stack
        env:
          MCP_API_KEY: ci-open-web-mcp-test-key-2026
          SEARXNG_SECRET: ci-searxng-secret-2026
          MCP_ALLOWED_HOSTS: localhost,127.0.0.1
        run: |
          set -euo pipefail
          docker compose up -d --build
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8787/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --no-color
          exit 1
      - name: Verify readiness
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8787/ready | tee /tmp/ready.json; then
              jq -e '.ready == true and .checks.chromium == true and .checks.search.ok == true and .checks.network == true and .checks.mcp == true' /tmp/ready.json
              exit 0
            fi
            sleep 2
          done
          docker compose logs --no-color
          exit 1
      - name: MCP Inspector handshake and tools/list
        env:
          MCP_TOKEN: ci-open-web-mcp-test-key-2026
        run: |
          set -euo pipefail
          export MCP_STORAGE_DIR="$(mktemp -d)"
          export MCP_INSPECTOR_OAUTH_STATE_PATH="$MCP_STORAGE_DIR/oauth.json"
          trap 'rm -rf "$MCP_STORAGE_DIR"' EXIT
          MCP='npx --yes @modelcontextprotocol/inspector@2.5.0 --cli http://127.0.0.1:8787/mcp --transport http --stored-auth-only --format json'
          eval "$MCP --method initialize --header \"Authorization: Bearer $MCP_TOKEN\"" | tee /tmp/mcp-init.json
          jq -e '.result.protocolVersion' /tmp/mcp-init.json >/dev/null
          eval "$MCP --method tools/list --header \"Authorization: Bearer $MCP_TOKEN\"" | tee /tmp/mcp-tools.json
          jq -e --argjson want '["search_web","open_url","extract_page","browser_navigate","browser_snapshot","browser_close"]' '[.result.tools[].name] as $have | $want - $have | length == 0' /tmp/mcp-tools.json >/dev/null
      - name: Full MCP smoke through Docker
        env:
          MCP_BASE_URL: http://127.0.0.1:8787
          MCP_API_KEY: ci-open-web-mcp-test-key-2026
        run: npm run smoke
      - name: Compose logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop Compose stack
        if: always()
        run: docker compose down -v --remove-orphans
