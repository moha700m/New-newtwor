services:
  - type: web
    name: open-web-mcp
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8787
      - key: HOST
        value: 0.0.0.0
      - key: MCP_API_KEY
        sync: false
      - key: MCP_ALLOWED_HOSTS
        sync: false
      - key: SEARXNG_URL
        sync: false
      - key: ENABLE_DDG_FALLBACK
        value: "true"
